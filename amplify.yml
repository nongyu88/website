version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E 'DATABASE_URL|S3_|APP_AWS_|JWT_SECRET|EMAIL_|RESEND_|STRIPE_|NEXT_PUBLIC_' >> .env.production
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*